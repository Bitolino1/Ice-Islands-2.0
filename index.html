<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Islands</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0ea5e9">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0; display: flex;
    flex-direction: column; align-items: center; min-height: 100vh;
  }
  h1 { margin: 14px 0 6px; font-size: 22px; letter-spacing: .5px; }
  h1 span { color: #38bdf8; }
  #stage { position: relative; }
  canvas {
    background: #87ceeb; border-radius: 14px; cursor: pointer;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); display: block;
  }
  #bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin: 10px 0; max-width: 900px; justify-content: center;
  }
  input, button, select {
    font: inherit; border-radius: 9px; border: none; padding: 8px 12px;
  }
  input[type=text] { width: 150px; }
  button {
    background: #1e293b; color: #e2e8f0; cursor: pointer;
    border: 1px solid #334155; transition: .15s;
  }
  button:hover { background: #334155; }
  button.room { background: #0ea5e9; color: #04293a; font-weight: 600; border: none; }
  button.room.active { background: #f8fafc; color: #0b3b52; }
  #chatrow { display: flex; gap: 8px; }
  #chat { width: 320px; }
  .hint { font-size: 12px; color: #94a3b8; max-width: 880px; text-align: center; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #0000; cursor: pointer; }
  .swatch.sel { border-color: #f8fafc; }
  #palette { display: flex; gap: 6px; }
  #shopbtn { background: #22c55e; color: #04210f; font-weight: 600; border: none; }
  #invite { background: #5865F2; color: #fff; font-weight: 600; border: none; }
  #install { background: #a855f7; color: #fff; font-weight: 600; border: none; }
  #accountbtn { background: #f59e0b; color: #3a2400; font-weight: 600; border: none; }
  #auth { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 11; }
  #auth.open { display: flex; }
  .authbox { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 20px; width: min(380px, 92vw); }
  .authbox input { width: 100%; margin: 8px 0; }
  .authmsg { font-size: 13px; color: #94a3b8; margin: 6px 0 4px; }
  .authmsg.err { color: #f87171; }
  .authmsg.ok { color: #34d399; }
  .authbtns { display: flex; gap: 8px; margin-top: 10px; }
  .authbtns button { flex: 1; }
  #doregister { background: #22c55e; color: #04210f; font-weight: 600; border: none; }
  #dologin { background: #0ea5e9; color: #04293a; font-weight: 600; border: none; }
  #coins { background: #1e293b; border: 1px solid #334155; border-radius: 9px; padding: 8px 12px; font-weight: 600; }
  #shop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  #shop.open { display: flex; }
  .shopbox { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 18px; width: min(580px, 92vw); max-height: 84vh; overflow: auto; }
  .shophead { display: flex; justify-content: space-between; align-items: center; }
  .shophead h2 { margin: 0; font-size: 20px; }
  #shopclose { background: #1e293b; border: 1px solid #334155; }
  .shopcat { margin: 14px 0 6px; color: #7dd3fc; font-weight: 600; font-size: 14px; }
  .shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; }
  .card { background: #1e293b; border-radius: 12px; padding: 10px; text-align: center; }
  .card .ic { font-size: 34px; line-height: 1.2; }
  .card .nm { font-size: 13px; margin: 2px 0 8px; min-height: 30px; display: flex; align-items: center; justify-content: center; }
  .card button { width: 100%; background: #0ea5e9; color: #04293a; font-weight: 600; border: none; }
  .card button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .card button.on { background: #f59e0b; color: #3a2400; }
</style>
</head>
<body>
  <h1>🐧 Ice <span>Islands</span></h1>

  <div id="bar">
    <input type="text" id="name" placeholder="Seu nome" maxlength="16">
    <div id="palette"></div>
    <button id="apply">Aplicar</button>
    <button class="room" data-room="vila">🏠 Praça</button>
    <button class="room" data-room="porto">⚓ Porto dos Barcos</button>
    <button class="room" data-room="ilha">🏝️ Ilha Secreta</button>
    <button id="shopbtn">🛍️ Loja</button>
    <span id="coins">🪙 0</span>
    <button id="invite">🔗 Convidar</button>
    <button id="install">📥 Instalar app</button>
    <button id="accountbtn">👤 Conta</button>
  </div>

  <div id="stage">
    <canvas id="cv" width="900" height="540"></canvas>
  </div>

  <div id="bar">
    <div id="chatrow">
      <input type="text" id="chat" placeholder="Digite e aperte Enter para falar..." maxlength="120">
      <button id="send">Falar</button>
    </div>
    <button data-emote="👋">👋 Aceno</button>
    <button data-emote="💃">💃 Dança</button>
    <button data-emote="❤️">❤️ Coração</button>
  </div>
  <p class="hint">Clique no cenário para <b>andar</b>. <b>Shift + clique</b> joga uma <b>bola de neve</b>. Troque de sala pelos botões. Abra a <b>🛍️ Loja</b> pra comprar e vestir roupas!</p>

  <div id="shop">
    <div class="shopbox">
      <div class="shophead">
        <h2>🛍️ Loja do Ice Islands</h2>
        <button id="shopclose">✕ Fechar</button>
      </div>
      <div id="shopitems"></div>
    </div>
  </div>

  <div id="auth">
    <div class="authbox">
      <div class="shophead">
        <h2>👤 Sua conta</h2>
        <button id="authclose">✕</button>
      </div>
      <p class="authmsg" id="authmsg">Crie uma conta pra salvar seu pinguim, moedas e roupas <b>pra sempre</b>!</p>
      <input type="text" id="authuser" placeholder="Usuário (3 a 16 letras/números)" maxlength="16" autocomplete="username">
      <input type="password" id="authpass" placeholder="Senha (mínimo 4)" maxlength="32" autocomplete="current-password">
      <div class="authbtns">
        <button id="doregister">Criar conta</button>
        <button id="dologin">Entrar</button>
      </div>
    </div>
  </div>

<script>
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');   // 'let' porque os cenarios sao pintados num canvas escondido
const W = cv.width, H = cv.height;

let myId = null;
let myRoom = 'vila';
const players = {};   // id -> {name,color,x,y,tx,ty,msg,msgT,emote,emoteT}
const balls = [];     // {x,y,tx,ty,t}
let myColor = '#3b82f6';
let CATALOG = {};     // id -> {name, price, slot, icon}
let coins = 0;
let owned = [];

// ---------- WebSocket ----------
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}/ws`);

ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.t === 'init') {
    myId = m.id; myRoom = m.room;
    for (const k in players) delete players[k];
    balls.length = 0;
    for (const p of m.players) addPlayer(p);
    syncRoomButtons();
  } else if (m.t === 'join') {
    addPlayer(m.player);
  } else if (m.t === 'leave') {
    delete players[m.id];
  } else if (m.t === 'move') {
    const p = players[m.id]; if (p) { p.tx = m.x; p.ty = m.y; }
  } else if (m.t === 'update') {
    const p = players[m.id]; if (p) { p.name = m.name; p.color = m.color; }
  } else if (m.t === 'chat') {
    const p = players[m.id]; if (p) { p.msg = m.text; p.msgT = performance.now(); }
  } else if (m.t === 'emote') {
    const p = players[m.id]; if (p) { p.emote = m.e; p.emoteT = performance.now(); }
  } else if (m.t === 'ball') {
    const p = players[m.id];
    const fx = p ? p.x : W/2, fy = p ? p.y : H/2;
    balls.push({ x: fx, y: fy, tx: m.x, ty: m.y, t: 0 });
  } else if (m.t === 'catalog') {
    CATALOG = m.items; buildShop();
  } else if (m.t === 'wallet') {
    coins = m.coins; owned = m.owned; updateCoins(); buildShop();
  } else if (m.t === 'outfit') {
    const p = players[m.id]; if (p) p.outfit = m.outfit;
    if (m.id === myId) buildShop();
  } else if (m.t === 'auth_ok') {
    document.getElementById('accountbtn').textContent = '👤 ' + m.user;
    document.getElementById('name').value = m.user;
    const msg = document.getElementById('authmsg');
    msg.className = 'authmsg ok';
    msg.textContent = 'Logado como ' + m.user + '! Seu progresso agora fica salvo. 🐧';
    setTimeout(() => document.getElementById('auth').classList.remove('open'), 1300);
  } else if (m.t === 'auth_err') {
    const msg = document.getElementById('authmsg');
    msg.className = 'authmsg err';
    msg.textContent = '⚠️ ' + m.reason;
  }
};
ws.onclose = () => { ctx.fillStyle = '#000a'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center';
  ctx.fillText('Conexão encerrada. Recarregue a página (F5).', W/2, H/2); };

function addPlayer(p) {
  players[p.id] = { name: p.name, color: p.color, x: p.x, y: p.y, tx: p.x, ty: p.y,
                    msg: '', msgT: 0, emote: '', emoteT: 0, outfit: p.outfit || {} };
}
function send(obj) { if (ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ---------- Input ----------
cv.addEventListener('click', (e) => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  if (e.shiftKey) {
    send({ t: 'ball', x, y });
    balls.push({ x: players[myId]?.x ?? W/2, y: players[myId]?.y ?? H/2, tx: x, ty: y, t: 0 });
  } else {
    const p = players[myId]; if (p) { p.tx = x; p.ty = y; }
    send({ t: 'move', x, y });
  }
});

document.getElementById('apply').onclick = () => {
  const name = document.getElementById('name').value.trim();
  send({ t: 'hello', name, color: myColor });
};
document.querySelectorAll('.room').forEach(b => b.onclick = () => {
  send({ t: 'room', room: b.dataset.room });
});
document.querySelectorAll('[data-emote]').forEach(b => b.onclick = () => {
  send({ t: 'emote', e: b.dataset.emote });
  const p = players[myId]; if (p) { p.emote = b.dataset.emote; p.emoteT = performance.now(); }
});
const chatInput = document.getElementById('chat');
function sendChat() {
  const text = chatInput.value.trim();
  if (text) { send({ t: 'chat', text }); chatInput.value = ''; }
}
document.getElementById('send').onclick = sendChat;
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

// color palette
const PALETTE = ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316'];
const pal = document.getElementById('palette');
PALETTE.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' sel' : '');
  s.style.background = c;
  s.onclick = () => { myColor = c; document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel')); s.classList.add('sel'); };
  pal.appendChild(s);
});
function syncRoomButtons() {
  document.querySelectorAll('.room').forEach(b =>
    b.classList.toggle('active', b.dataset.room === myRoom));
}

// ---------- Loja / Roupas ----------
const shopEl = document.getElementById('shop');
document.getElementById('shopbtn').onclick = () => shopEl.classList.toggle('open');
document.getElementById('shopclose').onclick = () => shopEl.classList.remove('open');
function updateCoins() { document.getElementById('coins').textContent = '🪙 ' + coins; }

// Botao Convidar: copia o link do site pra mandar no Discord / email
document.getElementById('invite').onclick = async () => {
  const btn = document.getElementById('invite');
  const link = location.href;
  let ok = false;
  try { await navigator.clipboard.writeText(link); ok = true; } catch (e) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}
  }
  btn.textContent = ok ? '✅ Link copiado!' : '🔗 Selecione e copie';
  setTimeout(() => { btn.textContent = '🔗 Convidar'; }, 2000);
};

// Conta: registrar e logar (progresso salvo pra sempre no servidor)
const authEl = document.getElementById('auth');
document.getElementById('accountbtn').onclick = () => authEl.classList.add('open');
document.getElementById('authclose').onclick = () => authEl.classList.remove('open');
document.getElementById('doregister').onclick = () => send({
  t: 'register',
  user: document.getElementById('authuser').value,
  pass: document.getElementById('authpass').value,
});
document.getElementById('dologin').onclick = () => send({
  t: 'login',
  user: document.getElementById('authuser').value,
  pass: document.getElementById('authpass').value,
});

// Instalar como app (PWA) — funciona no Mac e no Windows
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
document.getElementById('install').onclick = async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert('Como instalar o Ice Islands:\n\n' +
          '• Chrome / Edge (Windows e Mac): clique no ícone de instalar na barra de endereço, ou no menu ⋮ → "Instalar Ice Islands".\n\n' +
          '• Safari (Mac): menu Compartilhar → "Adicionar ao Dock".');
  }
};
window.addEventListener('appinstalled', () => {
  document.getElementById('install').textContent = '✅ Instalado';
});

// Registra o service worker (necessario pra instalar como app)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

const SLOT_NAMES = { hat: '🎩 Chapéus', glasses: '🕶️ Óculos', neck: '🧣 Pescoço', skin: '🐾 Skins' };

function buildShop() {
  const wrap = document.getElementById('shopitems');
  wrap.innerHTML = '';
  const out = (players[myId] && players[myId].outfit) || {};
  for (const slot of ['hat', 'glasses', 'neck', 'skin']) {
    const title = document.createElement('div');
    title.className = 'shopcat'; title.textContent = SLOT_NAMES[slot];
    wrap.appendChild(title);
    const grid = document.createElement('div'); grid.className = 'shopgrid';
    for (const id in CATALOG) {
      const it = CATALOG[id];
      if (it.slot !== slot) continue;
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<div class="ic">${it.icon}</div><div class="nm">${it.name}</div>`;
      if (slot === 'skin' && SKINS[id]) {            // mostra a skin de verdade, nao um emoji
        const ic = card.querySelector('.ic'); ic.textContent = '';
        const mini = document.createElement('canvas'); mini.width = 136; mini.height = 152;
        mini.style.cssText = 'width:68px;height:76px;background:none;box-shadow:none;border-radius:0;margin:0 auto;cursor:default';
        const screen = ctx; ctx = mini.getContext('2d');
        try { ctx.scale(2, 2); drawBody(34, 45, (players[myId] && players[myId].color) || myColor, id); } finally { ctx = screen; }
        ic.appendChild(mini);
      }
      const btn = document.createElement('button');
      if (!owned.includes(id)) {
        btn.textContent = '🪙 ' + it.price;
        btn.disabled = coins < it.price;
        btn.onclick = () => send({ t: 'buy', item: id });
      } else if (out[slot] === id) {
        btn.textContent = 'Tirar'; btn.className = 'on';
        btn.onclick = () => send({ t: 'equip', slot, item: '' });
      } else {
        btn.textContent = 'Vestir';
        btn.onclick = () => send({ t: 'equip', slot, item: id });
      }
      card.appendChild(btn);
      grid.appendChild(card);
    }
    wrap.appendChild(grid);
  }
}

// ---------- Render ----------
// ---------- Cenarios (desenho cartoon: contorno escuro, cores chapadas, neve e texturas) ----------
// Cada cenario e pintado UMA vez num canvas escondido e depois so copiado a cada quadro.
const INK = '#17324d';
function seeded(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function ink(fill, lw = 3) {
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
function vgrad(y0, y1, c0, c1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g;
}
function blob(pts) {
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  }
  ctx.closePath();
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
function cloud(x, y, s) {
  const parts = [[-34, 4, 24, 15], [-8, -8, 28, 21], [22, 2, 26, 16], [-4, 8, 40, 12]];
  ctx.strokeStyle = INK; ctx.lineWidth = 6;
  for (const [dx, dy, rx, ry] of parts) { ell(x + dx * s, y + dy * s, rx * s, ry * s); ctx.stroke(); }
  ctx.fillStyle = '#fff';
  for (const [dx, dy, rx, ry] of parts) { ell(x + dx * s, y + dy * s, rx * s, ry * s); ctx.fill(); }
  ctx.fillStyle = '#dcecf9'; ell(x - 2 * s, y + 13 * s, 34 * s, 5 * s); ctx.fill();
}
function peak(cx, baseY, w, h, col) {
  poly([[cx - w / 2, baseY], [cx, baseY - h], [cx + w / 2, baseY]]); ink(col);
  const k = 0.36, hw = w / 2 * k, y = baseY - h + h * k;      // capa de neve
  poly([[cx, baseY - h], [cx + hw, y], [cx + hw * 0.45, y - 9], [cx + hw * 0.1, y + 5],
        [cx - hw * 0.35, y - 8], [cx - hw, y]]); ink('#ffffff', 2.5);
}
function snowGround(yTop, seed) {
  ctx.beginPath(); ctx.moveTo(-10, yTop + 6);
  ctx.bezierCurveTo(150, yTop - 14, 300, yTop + 12, 450, yTop);
  ctx.bezierCurveTo(600, yTop - 12, 760, yTop + 10, 910, yTop - 4);
  ctx.lineTo(910, H + 10); ctx.lineTo(-10, H + 10); ctx.closePath();
  ink(vgrad(yTop, H, '#ffffff', '#d3e8f8'));
  const r = seeded(seed);
  ctx.lineCap = 'round';
  for (let i = 0; i < 16; i++) {                                // ondulacoes da neve
    const x = r() * W, y = yTop + 30 + r() * (H - yTop - 40), w = 40 + r() * 90;
    ctx.strokeStyle = 'rgba(141,190,228,.45)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.quadraticCurveTo(x, y - 9, x + w / 2, y); ctx.stroke();
  }
  for (let i = 0; i < 260; i++) {                               // graozinhos
    const x = r() * W, y = yTop + 14 + r() * (H - yTop - 14);
    ctx.fillStyle = r() < 0.5 ? 'rgba(150,196,232,.5)' : 'rgba(255,255,255,.95)';
    ell(x, y, 1 + r() * 1.4, 1 + r() * 1.2); ctx.fill();
  }
}
function pine(x, baseY, s) {
  ctx.beginPath(); ctx.rect(x - 6 * s, baseY - 16 * s, 12 * s, 18 * s); ink('#7a4a25');
  const tiers = [[46, 20, 58], [38, 52, 50], [28, 82, 44]];     // [meia-largura, altura da base, altura]
  for (const [hw, up, th] of tiers) {
    poly([[x - hw * s, baseY - up * s + 4 * s], [x, baseY - (up + th) * s], [x + hw * s, baseY - up * s + 4 * s]]);
    ink('#2f9e6b');
    ctx.fillStyle = '#237a52';                                  // sombra de um lado
    poly([[x, baseY - (up + th) * s + 6 * s], [x + hw * s - 7 * s, baseY - up * s + 1 * s], [x, baseY - up * s + 1 * s]]); ctx.fill();
    blob([[x - hw * 0.5 * s, baseY - (up + th * 0.45) * s], [x, baseY - (up + th + 3) * s],
          [x + hw * 0.5 * s, baseY - (up + th * 0.45) * s], [x + 5 * s, baseY - (up + th * 0.32) * s],
          [x, baseY - (up + th * 0.5) * s], [x - 6 * s, baseY - (up + th * 0.3) * s]]);
    ink('#fff', 2);
  }
  ctx.fillStyle = '#fff'; ell(x, baseY + 2 * s, 30 * s, 7 * s); ctx.fill();
}
function hangSign(text) {
  ctx.font = "bold 24px 'Trebuchet MS', 'Segoe UI', sans-serif";
  const w = Math.max(210, ctx.measureText(text).width + 56), x0 = W / 2 - w / 2;
  line(x0 + 26, -4, x0 + 26, 26, '#6b4a2b', 4); line(x0 + w - 26, -4, x0 + w - 26, 26, '#6b4a2b', 4);
  roundRect(x0, 24, w, 46, 10); ink('#c98b4b');
  line(x0 + 12, 38, x0 + w - 14, 38, 'rgba(120,74,37,.45)', 2);

function roofSnow(cx, eaveY, half, rise) {
  const L = [cx - half, eaveY], A = [cx, eaveY - rise], R = [cx + half, eaveY];
  const iA = [cx, eaveY - rise + 26], n = 5;
  ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.lineTo(A[0], A[1]); ctx.lineTo(R[0], R[1]);
  const seg = (p, q) => {
    for (let i = 1; i <= n; i++) {
      const t0 = (i - 1) / n, t1 = i / n;
      const mx = p[0] + (q[0] - p[0]) * (t0 + t1) / 2, my = p[1] + (q[1] - p[1]) * (t0 + t1) / 2;
      ctx.quadraticCurveTo(mx, my + 13, p[0] + (q[0] - p[0]) * t1, p[1] + (q[1] - p[1]) * t1);
    }
  };
  const iR = [cx + half - 26, eaveY + 3], iL = [cx - half + 26, eaveY + 3];
  ctx.lineTo(iR[0], iR[1]); seg(iR, iA); seg(iA, iL);
  ctx.closePath(); ink('#ffffff');
}
function windowBox(x, y, w, h) {
  roundRect(x, y, w, h, 5); ink(vgrad(y, y + h, '#fff3b8', '#ffd66b'));
  line(x + w / 2, y + 2, x + w / 2, y + h - 2, INK, 2.5); line(x + 2, y + h / 2, x + w - 2, y + h / 2, INK, 2.5);
  roundRect(x - 4, y + h - 1, w + 8, 7, 3.5); ink('#fff', 2);
}
function house(cx, baseY, w, h, wall, wallDark, roof, shop) {
  const x0 = cx - w / 2, top = baseY - h;
  roundRect(x0, top, w, h, 5); ink(wall);
  for (let y = top + 16; y < baseY - 6; y += 16) line(x0 + 5, y, x0 + w - 5, y, wallDark, 2);  // tabuas
  // chamine
  ctx.beginPath(); ctx.rect(cx + w * 0.2, top - 64, 24, 46); ink('#a8553f');
  roundRect(cx + w * 0.2 - 5, top - 71, 34, 11, 5); ink('#fff', 2.5);
  // telhado
  poly([[x0 - 18, top + 8], [cx, top - 74], [x0 + w + 18, top + 8]]); ink(roof);
  roofSnow(cx, top + 8, w / 2 + 22, 86);
  // pingentes de gelo
  for (let i = 0; i < 7; i++) {
    const ix = x0 - 8 + (w + 16) * (i + 0.5) / 7, len = 9 + (i * 7) % 9;
    poly([[ix - 4, top + 10], [ix + 4, top + 10], [ix, top + 10 + len]]); ink('#cdeeff', 1.5);

  if (shop) {

    // toldo listrado
    const ay = baseY - 78, aw = w + 12, ax = cx - aw / 2;

    ctx.restore(); roundRect(ax, ay, aw, 20, 6); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();

  blob([[x0 - 22, baseY + 6], [x0 + w * 0.2, baseY - 9], [cx - 26, baseY + 3], [cx - 24, baseY + 12], [x0 - 10, baseY + 14]]);
  ctx.fillStyle = '#fff'; ctx.fill();
  blob([[x0 + w + 22, baseY + 6], [x0 + w * 0.8, baseY - 9], [cx + 26, baseY + 3], [cx + 24, baseY + 12], [x0 + w + 10, baseY + 14]]);

function palm(x, baseY, lean, s) {
  const tx = x + lean * s, ty = baseY - 150 * s;
  const trunk = (col, lw) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, baseY); ctx.quadraticCurveTo(x + lean * 0.15 * s, baseY - 90 * s, tx, ty); ctx.stroke(); };
  trunk(INK, 20 * s); trunk('#b07a44', 14 * s);
  for (let i = 1; i < 8; i++) {                                 // aneis do tronco
    const t = i / 8, px = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * (x + lean * 0.15 * s) + t * t * tx;
    const py = (1 - t) * (1 - t) * baseY + 2 * (1 - t) * t * (baseY - 90 * s) + t * t * ty;
    line(px - 6 * s, py + 1, px + 6 * s, py - 2, 'rgba(90,55,25,.6)', 2);
  }
  const leaves = [[-92, -6, -50, -44], [-70, 44, -44, -8], [92, -6, 50, -44], [70, 44, 44, -8], [-40, -66, -30, -40], [42, -66, 30, -40]];
  for (const [ex, ey, cx, cy] of leaves) {
    const len = Math.hypot(ex, ey), nx = -ey / len * 15, ny = ex / len * 15;   // largura da folha
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + (cx + nx) * s, ty + (cy + ny) * s, tx + ex * s, ty + ey * s);
    ctx.quadraticCurveTo(tx + (cx - nx) * s, ty + (cy - ny) * s, tx, ty);
    ctx.closePath(); ink(ey > 20 ? '#27925a' : '#3fb86d', 2.5);
  }
  for (const [dx, dy] of [[-8, 6], [8, 8], [0, 14]]) { ell(tx + dx * s, ty + dy * s, 7 * s, 7 * s); ink('#7a4a25', 2); }
}

  ctx.fillStyle = '#c3ccd6'; blob([[x - 16 * s, y - 18 * s], [x - 2 * s, y - 30 * s], [x + 8 * s, y - 20 * s], [x - 6 * s, y - 14 * s]]); ctx.fill();

const PAINT = { vila: paintVila, porto: paintPorto, ilha: paintIlha };
const SCENE_CACHE = {};
function scene(name) {
  if (!PAINT[name]) name = 'ilha';
  if (!SCENE_CACHE[name]) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const screen = ctx; ctx = c.getContext('2d');
    try { PAINT[name](); } finally { ctx = screen; }
    SCENE_CACHE[name] = c;
  }
  return SCENE_CACHE[name];
}

// Neve caindo (Praca e Porto) — leve, so um enfeite por cima de tudo
const FLAKES = [];
{ const r = seeded(99); for (let i = 0; i < 70; i++) FLAKES.push({ x: r() * W, y: r() * H, r: 1.2 + r() * 2, v: 0.35 + r() * 0.7, p: r() * 6.28 }); }
function drawSnowfall() {
  const t = performance.now() / 1000;
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (const f of FLAKES) {
    f.y += f.v; if (f.y > H + 4) { f.y = -4; }
    ell(f.x + Math.sin(t * 0.8 + f.p) * 9, f.y, f.r, f.r); ctx.fill();
  }
}

// Corpo do personagem. Sem skin = pinguim. Toda skin usa as MESMAS medidas do pinguim
// (corpo 20x25, olhos em y-9, pes em y+26), entao chapeus, oculos e cachecol servem igual.
function drawBody(x, y, color, skin) {
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x,y+26,18,6,0,0,Math.PI*2); ctx.fill();
  if (skin && SKINS[skin]) { SKINS[skin](x, y, color); return; }
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x,y,20,25,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x,y+5,12,17,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.ellipse(x-8,y+26,6,3,0,0,Math.PI*2); ctx.ellipse(x+8,y+26,6,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x-6,y-9,2.6,0,Math.PI*2); ctx.arc(x+6,y-9,2.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(x-5,y-3); ctx.lineTo(x+5,y-3); ctx.lineTo(x,y+4); ctx.closePath(); ctx.fill();
}

// Altura (acima do centro) do ponto mais alto de skins que passam da cabeca (ex.: chifres)
const SKIN_TOP = { alce: 41 };

const SKINS = {
  // Castor: pelo castanho, dentoes, rabo achatado quadriculado; a cor do jogador fica nas orelhas.
  castor(x, y, color) {
    const FUR = '#a8683a', EDGE = '#5f3a1c', DARK = '#5b3a22';
    ctx.save(); ctx.translate(x + 17, y + 19); ctx.rotate(-0.5);          // rabo (atras do corpo)
    ell(0, 0, 13.5, 7.5); ctx.fillStyle = DARK; ctx.fill();
    ctx.save(); ell(0, 0, 13.5, 7.5); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let k = -24; k <= 24; k += 5) { ctx.moveTo(k - 8, -9); ctx.lineTo(k + 8, 9); ctx.moveTo(k + 8, -9); ctx.lineTo(k - 8, 9); }
    ctx.stroke(); ctx.restore();
    ell(0, 0, 13.5, 7.5); ctx.lineWidth = 1.4; ctx.strokeStyle = '#3b2413'; ctx.stroke();
    ctx.restore();
    for (const sx of [-1, 1]) {                                           // orelhas
      ell(x + sx * 13, y - 20.5, 5, 5); ctx.fillStyle = FUR; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = EDGE; ctx.stroke();
      ctx.fillStyle = color; ell(x + sx * 13, y - 20.5, 2.6, 2.6); ctx.fill();
    }
    for (const sx of [-1, 1]) { ell(x + sx * 8, y + 26, 7, 3.5); ctx.fillStyle = '#4a2f1b'; ctx.fill(); }   // pes
    ell(x, y, 20, 25); ctx.fillStyle = FUR; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = EDGE; ctx.stroke();  // corpo
    ctx.fillStyle = '#e3b98a'; ell(x, y + 9, 12, 13); ctx.fill();                                  // barriga
    ctx.fillStyle = '#fff'; ell(x - 6, y - 9, 3.5, 3.5); ctx.fill(); ell(x + 6, y - 9, 3.5, 3.5); ctx.fill();   // olhos
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x-6,y-9,2.3,0,Math.PI*2); ctx.arc(x+6,y-9,2.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = EDGE; ctx.lineWidth = 1;                            // dentoes
    ctx.beginPath(); ctx.rect(x - 3.3, y + 1.5, 3.3, 5.6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(x, y + 1.5, 3.3, 5.6); ctx.fill(); ctx.stroke();
    for (const sx of [-1, 1]) {                                           // bochechas do focinho
      ell(x + sx * 4.6, y - 0.6, 6, 4.6); ctx.fillStyle = '#edd0a8'; ctx.fill(); ctx.lineWidth = 1.1; ctx.strokeStyle = EDGE; ctx.stroke();
    }
    ctx.fillStyle = '#edd0a8'; ell(x, y - 0.6, 4, 3.8); ctx.fill();       // junta as duas bochechas
    ctx.fillStyle = EDGE;                                                 // pintinhas dos bigodes
    for (const sx of [-1, 1]) for (const [dx, dy] of [[5, -1.4], [7.4, 0], [5.4, 1.4]]) { ell(x + sx * dx, y + dy, 0.55, 0.55); ctx.fill(); }
    ctx.fillStyle = '#2a1a10'; ell(x, y - 3.6, 3.3, 2.3); ctx.fill();     // nariz
  },
  // Alce: pelo marrom, chifres largos, focinho grande; a cor do jogador fica nas orelhas.
  alce(x, y, color) {
    const FUR = '#8b5e34', EDGE = '#5a3a1c', HORN = '#e2c08d', HORN_EDGE = '#8a6a3c';
    for (const sx of [-1, 1]) {                                   // chifres
      poly([[x + sx * 10, y - 20], [x + sx * 15, y - 27], [x + sx * 13, y - 37], [x + sx * 18.5, y - 31],
            [x + sx * 21, y - 41], [x + sx * 24.5, y - 32], [x + sx * 30, y - 37], [x + sx * 28.5, y - 27],
            [x + sx * 22, y - 22], [x + sx * 14, y - 18]]);
      ctx.fillStyle = HORN; ctx.fill(); ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.strokeStyle = HORN_EDGE; ctx.stroke();
    }
    for (const sx of [-1, 1]) {                                   // orelhas
      ctx.save(); ctx.translate(x + sx * 18.5, y - 13.5); ctx.rotate(sx * -0.45);
      ell(0, 0, 6.5, 3.6); ctx.fillStyle = FUR; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = EDGE; ctx.stroke();
      ell(sx * 0.6, 0, 3.6, 1.8); ctx.fillStyle = color; ctx.fill();

    }
    for (const sx of [-1, 1]) { ell(x + sx * 8, y + 26, 6.6, 3.5); ctx.fillStyle = '#3b2a1a'; ctx.fill(); }   // cascos
    ell(x, y, 20, 25); ctx.fillStyle = FUR; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = EDGE; ctx.stroke();  // corpo
    ctx.fillStyle = '#b88a5c'; ell(x, y + 9, 12, 13); ctx.fill();                                  // barriga
    ctx.fillStyle = '#fff'; ell(x - 6, y - 9, 3.5, 3.5); ctx.fill(); ell(x + 6, y - 9, 3.5, 3.5); ctx.fill();   // olhos
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x-6,y-9,2.3,0,Math.PI*2); ctx.arc(x+6,y-9,2.3,0,Math.PI*2); ctx.fill();
    ell(x, y - 0.5, 9.5, 6); ctx.fillStyle = '#e2c08d'; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = EDGE; ctx.stroke();  // focinho
    ctx.fillStyle = EDGE; ell(x - 3.4, y - 2, 1.5, 1.1); ctx.fill(); ell(x + 3.4, y - 2, 1.5, 1.1); ctx.fill();  // narinas
    ctx.strokeStyle = EDGE; ctx.lineWidth = 1.1; ctx.lineCap = 'round';                                          // sorriso

  },
  // Urso polar: pelo branco com contorno (pra aparecer na neve); a cor do jogador fica nas orelhas.
  urso(x, y, color) {
    const FUR = '#fbfdff', EDGE = '#8fa6bd';
    const fur = (lw = 1.6) => { ctx.fillStyle = FUR; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = EDGE; ctx.stroke(); };
    for (const sx of [-1, 1]) {                                   // orelhas
      ell(x + sx * 13.5, y - 20, 6.5, 6.5); fur();
      ctx.fillStyle = color; ell(x + sx * 13.5, y - 20, 3.4, 3.4); ctx.fill();
    }
    for (const sx of [-1, 1]) { ell(x + sx * 8, y + 26, 7, 3.6); fur(1.4); }      // patas
    ell(x, y, 20, 25); fur();                                     // corpo
    ctx.fillStyle = '#e6edf5'; ell(x, y + 8, 12, 14); ctx.fill(); // barriga
    for (const sx of [-1, 1]) {                                   // dedinhos das patas
      ctx.strokeStyle = EDGE; ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(x + sx * 6, y + 26.5); ctx.lineTo(x + sx * 6, y + 28.6);
      ctx.moveTo(x + sx * 10, y + 26.5); ctx.lineTo(x + sx * 10, y + 28.6); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(244,114,182,.35)';                      // bochechas
    ell(x - 12, y - 3, 3.4, 2.2); ctx.fill(); ell(x + 12, y - 3, 3.4, 2.2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x-6,y-9,2.6,0,Math.PI*2); ctx.arc(x+6,y-9,2.6,0,Math.PI*2); ctx.fill();
    ell(x, y - 1, 7.5, 5.6); ctx.fillStyle = '#eef3f8'; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = EDGE; ctx.stroke();  // focinho
    ctx.fillStyle = '#111827'; ell(x, y - 3.4, 3.1, 2.2); ctx.fill();          // nariz
    ctx.strokeStyle = '#111827'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';   // boca
    ctx.beginPath(); ctx.moveTo(x, y - 1.4); ctx.lineTo(x, y + 0.6);
    ctx.quadraticCurveTo(x - 2, y + 2.6, x - 3.6, y + 1.2);
    ctx.moveTo(x, y + 0.6); ctx.quadraticCurveTo(x + 2, y + 2.6, x + 3.6, y + 1.2); ctx.stroke();
  },
};

function drawPenguin(p) {
  const x = p.x, y = p.y;
  drawBody(x, y, p.color, (p.outfit || {}).skin);
  // roupas (itens da loja)
  const out = p.outfit || {};
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // Cada item e desenhado sob medida pro corpo do pinguim (nao depende do emoji do aparelho).
  if (out.neck) {
    if (WEAR[out.neck]) WEAR[out.neck](x, y);
    else if (CATALOG[out.neck]) { ctx.font = '13px serif'; ctx.fillText(CATALOG[out.neck].icon, x, y+11); }
  }
  if (out.glasses) {
    if (WEAR[out.glasses]) WEAR[out.glasses](x, y);
    else if (CATALOG[out.glasses]) { ctx.font = '13px serif'; ctx.fillText(CATALOG[out.glasses].icon, x, y-9); }
  }
  if (out.hat) {
    if (WEAR[out.hat]) WEAR[out.hat](x, y);
    else if (CATALOG[out.hat]) { ctx.font = '16px serif'; ctx.fillText(CATALOG[out.hat].icon, x, y-27); }
  }
  ctx.textBaseline = 'alphabetic';
  // Sobe o nome / emote / balao pra nao ficar em cima do chapeu
  const lift = Math.max(out.hat ? (HAT_TOP[out.hat] ?? 34) : 25, SKIN_TOP[out.skin] ?? 25) - 25;
  const ly = y - lift;
  // nome
  ctx.font = '12px Segoe UI'; ctx.textAlign = 'center';
  const nw = ctx.measureText(p.name).width + 12;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(x-nw/2, ly-46, nw, 18, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(p.name, x, ly-33);
  // emote
  if (p.emote && performance.now() - p.emoteT < 2200) {
    ctx.font = '26px serif'; ctx.fillText(p.emote, x, ly-52);
  }
  // balao de chat
  if (p.msg && performance.now() - p.msgT < 5000) {
    ctx.font = '13px Segoe UI';
    const bw = Math.min(220, ctx.measureText(p.msg).width + 18);
    ctx.fillStyle = '#fff'; roundRect(x-bw/2, ly-78, bw, 24, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x-6,ly-55); ctx.lineTo(x+6,ly-55); ctx.lineTo(x,ly-46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.fillText(p.msg, x, ly-61);
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// Cachecol desenhado (envolve o pescoco, com pontinha caindo na frente)
function drawScarf(x, y) {
  const main = '#e23b3b', light = '#f8c2c2';
  // banda em volta do pescoco (segue a curva do corpo)
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(x, y + 6, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
  // listra clara
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.ellipse(x, y + 7.5, 16, 2.4, 0, 0, Math.PI * 2); ctx.fill();
  // ponta caindo na frente
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(x + 3, y + 8); ctx.lineTo(x + 12, y + 9);
  ctx.lineTo(x + 10, y + 22); ctx.lineTo(x + 1, y + 21);
  ctx.closePath(); ctx.fill();
  // franja na ponta
  ctx.fillStyle = light; ctx.fillRect(x + 1, y + 19, 10, 3);
}

// ---------- Roupas desenhadas sob medida ----------
// Medidas do pinguim: corpo = elipse 20x25 em (x,y); topo da cabeca em y-25;
// olhos em (x±6, y-9); bico de y-3 a y+4; pescoco por volta de y+6.
function ell(cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2) {
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, a0, a1); ctx.closePath();
}
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
// Altura (acima do centro) do ponto mais alto de cada chapeu
const HAT_TOP = { bone: 30, cartola: 38, coroa: 33, gorro: 37, capacete: 31, festa: 44 };

const WEAR = {
  // ----- chapeus -----
  bone(x, y) {
    ctx.fillStyle = '#1e40af';                                   // aba
    ell(x + 12, y - 17.5, 11, 2.6); ctx.fill();
    ctx.fillStyle = '#2563eb';                                   // copa
    ell(x, y - 17, 13.5, 12, Math.PI, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1e40af'; ctx.lineWidth = 1;              // costuras
    ctx.beginPath(); ctx.moveTo(x, y - 29); ctx.quadraticCurveTo(x - 5, y - 24, x - 6, y - 17.5);
    ctx.moveTo(x, y - 29); ctx.quadraticCurveTo(x + 5, y - 24, x + 6, y - 17.5); ctx.stroke();
    ctx.fillStyle = '#93c5fd'; ell(x, y - 29, 1.6, 1.3); ctx.fill();   // botao
  },
  cartola(x, y) {
    ctx.fillStyle = '#111827';
    ell(x, y - 19, 16, 3.4); ctx.fill();                         // aba
    ctx.fillRect(x - 10, y - 36, 20, 17);                        // copa
    ell(x, y - 36, 10, 2.2); ctx.fill();                         // tampa
    ctx.fillStyle = '#374151'; ell(x, y - 36, 8.4, 1.4); ctx.fill();
    ctx.fillStyle = '#dc2626'; ctx.fillRect(x - 10, y - 24.5, 20, 4);  // faixa
  },
  coroa(x, y) {
    ctx.fillStyle = '#fbbf24'; ctx.strokeStyle = '#b45309'; ctx.lineWidth = 1;
    poly([[x - 11, y - 18], [x - 12.5, y - 30], [x - 6.5, y - 24.5], [x, y - 33],
          [x + 6.5, y - 24.5], [x + 12.5, y - 30], [x + 11, y - 18]]);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f59e0b'; ctx.fillRect(x - 11, y - 21.5, 22, 3.5);  // base
    ctx.fillStyle = '#ef4444'; ell(x, y - 24.5, 1.9, 1.9); ctx.fill();   // joias
    ctx.fillStyle = '#3b82f6'; ell(x - 7, y - 20, 1.4, 1.4); ctx.fill(); ell(x + 7, y - 20, 1.4, 1.4); ctx.fill();
    ctx.fillStyle = '#fef3c7';
    for (const [px, py] of [[-12.5, -30], [0, -33], [12.5, -30]]) { ell(x + px, y + py, 1.6, 1.6); ctx.fill(); }
  },
  gorro(x, y) {
    ctx.fillStyle = '#dc2626';
    ell(x, y - 18, 14, 14, Math.PI, Math.PI * 2); ctx.fill();    // touca
    ctx.strokeStyle = '#991b1b'; ctx.lineWidth = 1;              // trico
    ctx.beginPath();
    for (const dx of [-7, 0, 7]) { ctx.moveTo(x + dx, y - 21); ctx.lineTo(x + dx * 0.55, y - 30); }
    ctx.stroke();
    ctx.fillStyle = '#f8fafc'; roundRect(x - 15, y - 22, 30, 6, 3); ctx.fill();   // barra
    ctx.fillStyle = '#f8fafc'; ell(x, y - 33, 4, 4); ctx.fill();                  // pompom
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = .8; ell(x, y - 33, 4, 4); ctx.stroke();
  },
  capacete(x, y) {
    ctx.fillStyle = '#ef4444';
    ell(x, y - 17, 15, 14, Math.PI, Math.PI * 2); ctx.fill();    // casco
    ctx.fillStyle = '#b91c1c'; roundRect(x - 17, y - 19.5, 34, 4, 2); ctx.fill();  // aba
    ctx.fillStyle = '#fff';                                      // cruz
    ctx.fillRect(x - 1.6, y - 28.5, 3.2, 8); ctx.fillRect(x - 4, y - 26.1, 8, 3.2);
  },
  festa(x, y) {
    const cone = [[x - 9, y - 18.5], [x, y - 41], [x + 9, y - 18.5]];
    ctx.fillStyle = '#ec4899'; poly(cone); ctx.fill();
    ctx.save(); poly(cone); ctx.clip();                          // listras
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let k = 0; k < 4; k++) { ctx.moveTo(x - 12, y - 20 - k * 6.5); ctx.lineTo(x + 12, y - 25 - k * 6.5); }
    ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#38bdf8'; ell(x, y - 18.5, 9.5, 2); ctx.fill();   // barra
    ctx.fillStyle = '#fde047'; ell(x, y - 41, 3, 3); ctx.fill();       // pompom
  },
  // ----- oculos -----
  oculos(x, y) {
    ctx.fillStyle = '#0b0f19';
    roundRect(x - 12, y - 12.5, 10.5, 7, 2.6); ctx.fill();
    roundRect(x + 1.5, y - 12.5, 10.5, 7, 2.6); ctx.fill();
    ctx.fillRect(x - 2, y - 11.6, 4, 1.6);                       // ponte
    ctx.strokeStyle = '#0b0f19'; ctx.lineWidth = 1.4;            // hastes
    ctx.beginPath(); ctx.moveTo(x - 12, y - 10.6); ctx.lineTo(x - 17.5, y - 11.6);
    ctx.moveTo(x + 12, y - 10.6); ctx.lineTo(x + 17.5, y - 11.6); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)';                      // brilho
    ctx.fillRect(x - 10, y - 11.3, 3, 1.2); ctx.fillRect(x + 3.5, y - 11.3, 3, 1.2);
  },
  neve(x, y) {
    ctx.fillStyle = '#334155'; ctx.fillRect(x - 18.5, y - 11.5, 37, 4);   // elastico
    ctx.fillStyle = '#1e293b'; roundRect(x - 13.5, y - 15, 27, 11, 4.5); ctx.fill();  // armacao
    const g = ctx.createLinearGradient(x - 11, y - 14, x + 11, y - 5);
    g.addColorStop(0, '#fb923c'); g.addColorStop(1, '#38bdf8');
    ctx.fillStyle = g; roundRect(x - 11.5, y - 13.2, 23, 7.4, 3.2); ctx.fill();       // lente
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x - 9, y - 12, 5, 1.4);
  },
  nerd(x, y) {
    ctx.fillStyle = 'rgba(186,230,253,.3)';
    ell(x - 6, y - 9, 5, 5); ctx.fill(); ell(x + 6, y - 9, 5, 5); ctx.fill();
    ctx.strokeStyle = '#111827'; ctx.lineWidth = 1.5;
    ell(x - 6, y - 9, 5, 5); ctx.stroke(); ell(x + 6, y - 9, 5, 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 1.2, y - 9.6); ctx.lineTo(x + 1.2, y - 9.6);     // ponte
    ctx.moveTo(x - 11, y - 9.6); ctx.lineTo(x - 17.5, y - 11);                       // hastes
    ctx.moveTo(x + 11, y - 9.6); ctx.lineTo(x + 17.5, y - 11); ctx.stroke();
  },
  // ----- pescoco -----
  cachecol(x, y) { drawScarf(x, y); },
  laco(x, y) {
    const cy = y + 9.5;
    ctx.fillStyle = '#ec4899'; ctx.strokeStyle = '#be185d'; ctx.lineWidth = .8;
    poly([[x - 1.5, cy], [x - 9.5, cy - 5], [x - 9.5, cy + 5]]); ctx.fill(); ctx.stroke();
    poly([[x + 1.5, cy], [x + 9.5, cy - 5], [x + 9.5, cy + 5]]); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#be185d'; roundRect(x - 2.4, cy - 2.6, 4.8, 5.2, 1.6); ctx.fill();  // no
  },
  medalha(x, y) {
    ctx.fillStyle = '#2563eb';                                   // fita em V
    poly([[x - 11, y + 3], [x - 7.5, y + 2.4], [x + 1.4, y + 13], [x - 1.4, y + 14.5]]); ctx.fill();
    ctx.fillStyle = '#dc2626';
    poly([[x + 11, y + 3], [x + 7.5, y + 2.4], [x - 1.4, y + 13], [x + 1.4, y + 14.5]]); ctx.fill();
    ctx.fillStyle = '#fbbf24'; ctx.strokeStyle = '#b45309'; ctx.lineWidth = 1;
    ell(x, y + 17, 4.8, 4.8); ctx.fill(); ctx.stroke();          // medalha
    ctx.fillStyle = '#fef3c7'; ell(x, y + 17, 2, 2); ctx.fill();
  },
};

function loop() {
  ctx.drawImage(scene(myRoom), 0, 0);

  // interpola movimento
  for (const id in players) {
    const p = players[id];
    p.x += (p.tx - p.x) * 0.18;
    p.y += (p.ty - p.y) * 0.18;
  }
  // desenha por ordem de Y (profundidade)
  Object.values(players).sort((a,b) => a.y - b.y).forEach(drawPenguin);
  if (myRoom === 'vila' || myRoom === 'porto') drawSnowfall();

  // bolas de neve
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i]; b.t += 0.04;
    const bx = b.x + (b.tx - b.x) * b.t;
    const by = b.y + (b.ty - b.y) * b.t - Math.sin(Math.PI * b.t) * 40;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#cbd5e1';
    ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    if (b.t >= 1) {
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(b.tx, b.ty, 12, 0, Math.PI*2); ctx.fill();
      balls.splice(i, 1);
    }
  }
  requestAnimationFrame(loop);
}
loop();
</script>
